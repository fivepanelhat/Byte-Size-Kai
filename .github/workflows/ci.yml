name: CI - Byte-Size-Kai

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install flake8
        run: python -m pip install --upgrade pip && pip install flake8
      - name: Lint (fatal errors — syntax and undefined names)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,node_modules,build,dist,data,out

# Public repo is posture-only. Do not clone Coastal-Alpine-Core here.
# Full pytest and verify-core-update live on private repos.
