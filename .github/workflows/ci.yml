name: CI - Byte-Size-Kai

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system audio libs (pyaudio build dep)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq portaudio19-dev

      - name: Install public dependencies (skip private Core)
        run: |
          grep -v -E 'coastal-alpine-core|Coastal-Alpine-Core' requirements.txt > /tmp/requirements-public-ci.txt
          pip install -r /tmp/requirements-public-ci.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Run public test suite
        run: pytest -q --tb=short

# Private Core verify lives on fivepanelhat/cat-byte-size-kai-edge and Coastal-Alpine-Core.
# Do not call fivepanelhat/coastal-alpine-core composite actions from this public repo.
