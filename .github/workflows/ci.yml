name: CI - Byte-Size-Kai

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install flake8
        run: python -m pip install --upgrade pip && pip install flake8
      - name: Lint (fatal errors — syntax and undefined names)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,node_modules,build,dist,data,out
      - name: Public posture lint
        run: python scripts/posture_lint.py

  demo-url:
    name: public-demo-url
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Confirm README still names the simulated demo
        run: |
          grep -F "https://field-brave-palm-lagoon.grok.me/kai" README.md
      - name: HEAD the simulated demo (non-blocking watch)
        continue-on-error: true
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://field-brave-palm-lagoon.grok.me/kai" || true)
          echo "demo_http_status=$code"
          if [ "$code" != "200" ] && [ "$code" != "301" ] && [ "$code" != "302" ]; then
            echo "::warning::Simulated demo URL returned $code — treat as a posture incident if this persists."
          fi
